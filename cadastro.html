<!DOCTYPE html>

<body>
    <h1>Cadastro</h1>
    <p>Preencha o formulário abaixo para se cadastrar:</p>
    <form action="enviar_cadastro.php" method="post">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome completo" name="nome" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" required>

        <label for="turno-período">Turno/Período:</label>
        <select id="turno-período" name="turno-período" required>
            <option value="">Selecione um turno/período</option>
            <option value="manha">Manhã</option>
            <option value="tarde">Tarde</option>
            <option value="noite">Noite</option>
        </select>
        
        <br>
        <label for="curso">Curso de Interesse:</label>
        <select id="curso" name="curso" required>
            <option value="">Selecione um curso</option>
            <option value="ingles">Curso de Inglês</option>
            <option value="matematica">Curso de Matemática</option>
            <option value="informatica">Curso de Informática</option>
            <option value="artes">Curso de Artes</option>
        </select>

        <br>
        <label for="interesses">Interesses:</label>
        <input type="text" id="interesses" name="interesses" required>

        <button type="submit">Cadastrar</button>
        <a href="index.html"><button type="button">Voltar à página inicial</button></a>
    </form>
</body>
</html>
